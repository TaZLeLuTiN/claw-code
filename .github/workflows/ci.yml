name: CI — harnais-mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # edition 2024 (requise par chacha20 0.10, transitive) n'est stabilisée qu'en
          # 1.85 — 1.78 ET 1.84 échouent à parser le manifeste. Plancher, pas préférence.
          toolchain: "1.85"
          components: rustfmt, clippy
      # — Gate : harnais-mcp (le crate du job, strictement vert). —
      - name: cargo fmt check (harnais-mcp)
        run: cargo fmt -p harnais-mcp --check
        working-directory: rust/
      - name: cargo clippy (harnais-mcp)
        run: cargo clippy -p harnais-mcp --all-targets -- -D warnings
        working-directory: rust/
      - name: cargo test (harnais-mcp)
        run: cargo test -p harnais-mcp
        working-directory: rust/
      # — Observabilité NON bloquante : la dette runtime/ (46 clippy errors, quarantaine
      #   deadline 2026-07-15) reste visible sans prendre le gate ni les merges en otage.
      #   Réintégrer au gate quand la dette est purgée. —
      - name: cargo clippy workspace (non bloquant — suivi dette runtime/)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust/
        continue-on-error: true
