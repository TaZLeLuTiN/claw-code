[package]
name = "harnais-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "Harnais MCP server — exposes Ollama as MCP tools + IA classifier"
publish = false

[[bin]]
name = "harnais-mcp"
path = "src/main.rs"

[lib]
name = "harnais_mcp"
path = "src/lib.rs"

[dependencies]
tokio          = { version = "1",    features = ["full"] }
serde          = { version = "1",    features = ["derive"] }
serde_json     = "1"
reqwest        = { version = "0.12", features = ["json"] }
anyhow         = "1"
thiserror      = "1"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid           = { version = "1",    features = ["v4"] }
tokio-postgres = { version = "0.7",  features = ["with-uuid-1", "with-serde_json-1"] }

[dev-dependencies]
tokio-test = "0.4"
